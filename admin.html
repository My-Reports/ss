<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة تحديث البيانات | لوحة القياس</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; padding: 50px; background: #f4f7f6; color: #333; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; text-align: center; }
        .upload-btn { background: #0056b3; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.3s; }
        .upload-btn:hover { background: #004494; }
        #status { margin-top: 20px; font-weight: bold; font-size: 14px; padding: 10px; border-radius: 5px;}
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .processing { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
        input[type="file"] { margin-top: 15px; width: 100%; padding: 10px; border: 1px dashed #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>تحديث بيانات النظام</h2>
    <p>قم برفع ملف Excel لتحديث بيانات الموقع مباشرة. سيتم استبدال كافة البيانات الحالية.</p>
    <input type="file" id="excelFile" accept=".xlsx, .xls">
    <button class="upload-btn" onclick="uploadData()">رفع وتحديث البيانات</button>
    <div id="status" style="display: none;"></div>
</div>

<script>
    // 👇 قم بوضع رابط Cloudflare الخاص بك بين علامتي التنصيص أدناه 👇
    const WORKER_URL = "ضع_الرابط_الخاص_بك_هنا";

    function showStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = type;
        statusDiv.innerText = message;
    }

    function uploadData() {
        const fileInput = document.getElementById('excelFile');

        if (!fileInput.files.length) {
            showStatus("الرجاء اختيار ملف Excel أولاً.", "error");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        showStatus("جاري معالجة الملف وتحويله...", "processing");

        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // قراءة أول ورقة عمل (Sheet)
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // تحويل البيانات إلى JSON
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                if (jsonData.length === 0) {
                    showStatus("ملف الإكسل فارغ أو لا يحتوي على بيانات صحيحة.", "error");
                    return;
                }

                showStatus("جاري رفع البيانات إلى الخادم (Cloudflare)...", "processing");

                // إرسال البيانات
                const response = await fetch(WORKER_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });

                if(response.ok) {
                    showStatus("تم تحديث البيانات بنجاح! يمكنك الآن فتح لوحة القياس.", "success");
                    fileInput.value = ""; // تفريغ الحقل
                } else {
                    throw new Error("فشل الرفع للخادم");
                }
            } catch (error) {
                showStatus("حدث خطأ أثناء الرفع: " + error.message, "error");
                console.error(error);
            }
        };

        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
