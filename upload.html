<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة البيانات | Upload Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1e293b; color: white; margin: 0; }
        .upload-card { background: #2d3748; padding: 40px; border-radius: 20px; text-align: center; border: 2px dashed #4a5568; }
        input { margin: 20px 0; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 20px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="upload-card">
    <h2>مركز رفع بيانات الإكسيل 📤</h2>
    <p>اختر ملف البيانات الضخمة لتحديث Cloud Firestore</p>
    <input type="file" id="excelFile" accept=".xlsx, .xls" />
    <br>
    <button onclick="uploadToFirebase()">بدء عملية الرفع</button>
    <div id="status">جاهز...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAM6IVvjwY995nV1JTqXwAmvIVkxnae5RE",
        authDomain: "pharma-analytics-21b68.firebaseapp.com",
        projectId: "pharma-analytics-21b68",
        storageBucket: "pharma-analytics-21b68.firebasestorage.app",
        messagingSenderId: "966043206141",
        appId: "1:966043206141:web:b1c4c2547ef97b55bc1994"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function uploadToFirebase() {
        const fileInput = document.getElementById('excelFile');
        const status = document.getElementById('status');
        
        if (!fileInput.files[0]) return alert("فضلاً اختر الملف!");

        status.innerText = "جاري المعالجة...";
        const reader = new FileReader();

        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(sheet);

            status.innerText = `بدء رفع ${jsonData.length} سجل...`;

            // استخدام Batch لرفع البيانات بكفاءة (كل Batch يتحمل 500 عملية)
            const batch = db.batch();
            jsonData.forEach((row) => {
                const docRef = db.collection('sales_data').doc();
                batch.set(docRef, {
                    Customer: row['Customer'] || 'N/A',
                    ProductName: row['Product Name'] || 'N/A',
                    Sector: row['Sector'] || 'Other',
                    GoodsValue: parseFloat(String(row['Goods Value']).replace(/,/g, '')) || 0,
                    BudgetValue: parseFloat(String(row['Budget Value']).replace(/,/g, '')) || 0,
                    Month: row['Month'] || 0,
                    Timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            });

            try {
                await batch.commit();
                status.innerHTML = "<b style='color:#10b981'>✅ تم بنجاح! اذهب لصفحة الـ Dashboard الآن.</b>";
            } catch (err) {
                status.innerText = "خطأ في الرفع: " + err.message;
            }
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }
</script>
</body>
</html>
