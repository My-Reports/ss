<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التحليل المتقدم | إياد سليمان</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --secondary: #64748b; --success: #22c55e; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        .dashboard-container { max-width: 1300px; margin: auto; }
        
        /* Header & Stats */
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-right: 5px solid var(--primary); }
        .stat-card h3 { margin: 0; color: var(--secondary); font-size: 14px; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: #0f172a; margin-top: 5px; }

        /* Charts */
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-bottom: 25px; }
        @media (max-width: 1024px) { .main-grid { grid-template-columns: 1fr; } }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .card h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; }

        /* Table Pagination Styling */
        .table-container { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #f8fafc; padding: 15px; color: #64748b; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        tr:hover { background: #f8fafc; }
        
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; align-items: center; }
        .page-btn { background: white; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .page-btn:hover { background: var(--primary); color: white; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p>جاري مزامنة البيانات الضخمة...</p>
</div>

<div class="dashboard-container">
    <div class="header">
        <h1 style="color: var(--primary); margin: 0;">لوحة تحليل المبيعات والأهداف</h1>
        <div style="text-align: left;">
            <div id="dataStatus" style="color: var(--success); font-weight: bold;">● متصل بالخادم</div>
            <small id="lastSync" style="color: var(--secondary);"></small>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>إجمالي المبيعات (Actual)</h3>
            <div class="value" id="totalSales">0</div>
        </div>
        <div class="stat-card" style="border-right-color: #f59e0b;">
            <h3>إجمالي الميزانية (Budget)</h3>
            <div class="value" id="totalBudget">0</div>
        </div>
        <div class="stat-card" style="border-right-color: var(--success);">
            <h3>نسبة الإنجاز %</h3>
            <div class="value" id="achievement">0%</div>
        </div>
        <div class="stat-card" style="border-right-color: #ec4899;">
            <h3>عدد السجلات</h3>
            <div class="value" id="rowCount">0</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h2>مقارنة الأداء: المبيعات الفعلية مقابل الميزانية</h2>
            <canvas id="comparisonChart" height="150"></canvas>
        </div>
        <div class="card">
            <h2>توزع الحصة السوقية</h2>
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="table-container card">
        <h2>تفاصيل البيانات كاملة</h2>
        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead><tr id="headerRow"></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <button class="page-btn" id="prevPage" onclick="changePage(-1)">السابق</button>
            <span id="pageInfo">صفحة 1 من 1</span>
            <button class="page-btn" id="nextPage" onclick="changePage(1)">التالي</button>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://excel-api.eyad-sulayman.workers.dev";
    let allData = [];
    let currentPage = 1;
    const rowsPerPage = 20;

    async function initDashboard() {
        try {
            const response = await fetch(WORKER_URL);
            allData = await response.json();
            
            if (allData.length > 0) {
                renderStats();
                renderCharts();
                updateTable();
                document.getElementById('lastSync').innerText = "آخر تحديث: " + new Date().toLocaleTimeString();
            }
            document.getElementById('loading-overlay').style.display = 'none';
        } catch (err) {
            alert("خطأ في الاتصال: " + err.message);
        }
    }

    function renderStats() {
        const headers = Object.keys(allData[0]);
        // البحث عن أعمدة الأرقام (تأكد من تسميتها Sales و Budget في ملفك)
        const salesCol = headers.find(h => h.toLowerCase().includes('sales') || h.includes('مبيعات'));
        const budgetCol = headers.find(h => h.toLowerCase().includes('budget') || h.includes('ميزانية'));

        let tSales = 0, tBudget = 0;
        allData.forEach(row => {
            tSales += parseFloat(row[salesCol]) || 0;
            tBudget += parseFloat(row[budgetCol]) || 0;
        });

        document.getElementById('totalSales').innerText = tSales.toLocaleString() + " $";
        document.getElementById('totalBudget').innerText = tBudget.toLocaleString() + " $";
        document.getElementById('rowCount').innerText = allData.length.toLocaleString();
        
        const perc = tBudget > 0 ? ((tSales / tBudget) * 100).toFixed(1) : 0;
        document.getElementById('achievement').innerText = perc + "%";
    }

    function renderCharts() {
        const headers = Object.keys(allData[0]);
        const labelCol = headers[0];
        const salesCol = headers.find(h => h.toLowerCase().includes('sales') || h.includes('مبيعات'));
        const budgetCol = headers.find(h => h.toLowerCase().includes('budget') || h.includes('ميزانية'));

        // مقارنة Sales vs Budget (أول 10 عناصر لضمان نظافة الرسم)
        const limitedData = allData.slice(0, 15);
        
        new Chart(document.getElementById('comparisonChart'), {
            type: 'bar',
            data: {
                labels: limitedData.map(r => r[labelCol]),
                datasets: [
                    { label: 'المبيعات الفعلية', data: limitedData.map(r => r[salesCol]), backgroundColor: '#2563eb' },
                    { label: 'الميزانية المقدرة', data: limitedData.map(r => r[budgetCol]), backgroundColor: '#f59e0b' }
                ]
            },
            options: { responsive: true, plugins: { legend: { position: 'top' } } }
        });

        new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: {
                labels: limitedData.map(r => r[labelCol]),
                datasets: [{
                    data: limitedData.map(r => r[salesCol]),
                    backgroundColor: ['#2563eb', '#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe']
                }]
            }
        });
    }

    function updateTable() {
        const headers = Object.keys(allData[0]);
        const headerRow = document.getElementById('headerRow');
        headerRow.innerHTML = "";
        headers.forEach(h => headerRow.innerHTML += `<th>${h}</th>`);

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = allData.slice(start, end);

        pageData.forEach(row => {
            let tr = "<tr>";
            headers.forEach(h => tr += `<td>${row[h] || '-'}</td>`);
            tbody.innerHTML += tr + "</tr>";
        });

        const totalPages = Math.ceil(allData.length / rowsPerPage);
        document.getElementById('pageInfo').innerText = `صفحة ${currentPage} من ${totalPages}`;
        document.getElementById('prevPage').disabled = currentPage === 1;
        document.getElementById('nextPage').disabled = currentPage === totalPages;
    }

    function changePage(step) {
        currentPage += step;
        updateTable();
        window.scrollTo(0, document.getElementById('dataTable').offsetTop - 100);
    }

    window.onload = initDashboard;
</script>
</body>
</html>
