<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة تحديث البيانات</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 50px; background: #f4f7f6; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn { background: #0056b3; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; }
        #status { margin-top: 20px; padding: 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>تحديث بيانات الموقع</h2>
    <p>ارفع ملف Excel لتحويله إلى بيانات حية</p>
    <input type="file" id="excelFile" accept=".xlsx, .xls">
    <button class="btn" onclick="uploadData()">تحديث البيانات الآن</button>
    <div id="status"></div>
</div>

<script>
    // ⚠️ استبدل الرابط أدناه برابط الـ Worker الخاص بك من Cloudflare ⚠️
    const WORKER_URL = "https://tight-wood-16cd.eyad-sulayman.workers.dev";

    async function uploadData() {
        const fileInput = document.getElementById('excelFile');
        const status = document.getElementById('status');
        
        if (!fileInput.files.length) return alert("اختر ملفاً");

        const reader = new FileReader();
        status.innerText = "جاري التحويل والرفع...";
        status.style.background = "#cce5ff";

        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                const res = await fetch(WORKER_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });

                if (res.ok) {
                    status.innerText = "تم التحديث بنجاح! اذهب لمشاهدة الموقع.";
                    status.style.background = "#d4edda";
                } else {
                    throw new Error("فشل الرفع للخادم");
                }
            } catch (err) {
                status.innerText = "خطأ: " + err.message;
                status.style.background = "#f8d7da";
            }
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }
</script>
</body>
</html>
