<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رفع Excel</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<h2>📤 رفع ملف Excel</h2>

<input type="file" id="file" />
<button onclick="upload()">رفع</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBh-uJg7D6Js6TtwtnOUhdTKVersRV--po",
  authDomain: "dashboard-project-493a7.firebaseapp.com",
  projectId: "dashboard-project-493a7",
  storageBucket: "dashboard-project-493a7.firebasestorage.app",
  messagingSenderId: "63299059149",
  appId: "1:63299059149:web:92c5fd6a73aba40d28d884",
  measurementId: "G-8SS8ZWBZ9N"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.upload = async function() {

  let file = document.getElementById("file").files[0];
  let data = await file.arrayBuffer();

  let workbook = XLSX.read(data);
  let sheet = workbook.Sheets[workbook.SheetNames[0]];
  let json = XLSX.utils.sheet_to_json(sheet);

  // 🧹 حذف البيانات القديمة
  let snapshot = await getDocs(collection(db, "data"));

  for (let d of snapshot.docs) {
    await deleteDoc(doc(db, "data", d.id));
  }

  // 📤 رفع البيانات الجديدة
  for (let row of json) {
    await addDoc(collection(db, "data"), row);
  }

  alert("تم رفع البيانات بنجاح 🚀");
};

</script>

</body>
</html>
