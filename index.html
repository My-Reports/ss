<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Analytics | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        h1 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة التحليلات الدوائية 📊</h1>
    
    <div class="grid">
        <div class="card">
            <h4 style="text-align:center;">المبيعات الفعلية مقابل الميزانية</h4>
            <canvas id="salesChart"></canvas>
        </div>
        <div class="card">
            <h4 style="text-align:center;">توزيع المبيعات حسب القطاع</h4>
            <canvas id="sectorChart"></canvas>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAM6IVvjwY995nV1JTqXwAmvIVkxnae5RE",
        authDomain: "pharma-analytics-21b68.firebaseapp.com",
        projectId: "pharma-analytics-21b68",
        storageBucket: "pharma-analytics-21b68.firebasestorage.app",
        messagingSenderId: "966043206141",
        appId: "1:966043206141:web:b1c4c2547ef97b55bc1994"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function loadDashboard() {
        const snapshot = await db.collection('sales_data').orderBy('Timestamp', 'desc').limit(100).get();
        let labels = [], sales = [], budgets = [], sectors = {};

        snapshot.forEach(doc => {
            const d = doc.data();
            labels.push(d.ProductName);
            sales.push(d.GoodsValue);
            budgets.push(d.BudgetValue);
            sectors[d.Sector] = (sectors[d.Sector] || 0) + d.GoodsValue;
        });

        renderCharts(labels, sales, budgets, sectors);
    }

    function renderCharts(labels, sales, budgets, sectors) {
        new Chart(document.getElementById('salesChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'الفعلي', data: sales, backgroundColor: '#2563eb' },
                    { label: 'الميزانية', data: budgets, backgroundColor: '#cbd5e1' }
                ]
            }
        });

        new Chart(document.getElementById('sectorChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(sectors),
                datasets: [{ data: Object.values(sectors), backgroundColor: ['#10b981', '#f59e0b', '#ef4444', '#8b5cf6'] }]
            }
        });
    }

    loadDashboard();
</script>
</body>
</html>
