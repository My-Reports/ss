<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القياس الحية | Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fc; margin: 0; padding: 20px; color: #333; }
        .dashboard-container { max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #edf2f7; text-align: right; }
        th { background-color: #f7fafc; color: #4a5568; }
        #loading { text-align: center; font-size: 20px; color: #718096; padding: 100px; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1 style="color: #2b6cb0; margin: 0;">نظام تحليل البيانات</h1>
        <div id="dataStatus" style="color: #48bb78; font-weight: bold;">متصل بالخادم</div>
    </div>

    <div id="loading">جاري مزامنة البيانات من Cloudflare...</div>

    <div id="mainContent" style="display: none;">
        <div class="card">
            <h2 style="color: #2d3748; border-bottom: 2px solid #ebf4ff; padding-bottom: 10px;">التمثيل البياني</h2>
            <canvas id="myChart" height="120"></canvas>
        </div>

        <div class="card">
            <h2 style="color: #2d3748;">جدول البيانات التفصيلي</h2>
            <div style="overflow-x: auto;">
                <table id="dataTable">
                    <thead><tr id="headerRow"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://excel-api.eyad-sulayman.workers.dev";

    async function loadData() {
        try {
            const response = await fetch(WORKER_URL);
            const data = await response.json();

            if (!data || data.length === 0) {
                document.getElementById('loading').innerText = "لا توجد بيانات متاحة. يرجى الرفع من صفحة admin.html";
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            // بناء الجدول ديناميكياً
            const headers = Object.keys(data[0]);
            const headerRow = document.getElementById('headerRow');
            headers.forEach(h => headerRow.innerHTML += `<th>${h}</th>`);
            
            const tbody = document.getElementById('tableBody');
            data.forEach(row => {
                let tr = "<tr>";
                headers.forEach(h => tr += `<td>${row[h] || '-'}</td>`);
                tbody.innerHTML += tr + "</tr>";
            });

            // الرسم البياني
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(r => r[headers[0]]),
                    datasets: [{
                        label: headers[1] || 'القيم',
                        data: data.map(r => r[headers[1]]),
                        backgroundColor: '#4299e1',
                        borderRadius: 5
                    }]
                },
                options: { responsive: true }
            });

        } catch (err) {
            document.getElementById('loading').innerText = "حدث خطأ في الاتصال بالخادم: " + err.message;
        }
    }

    window.onload = loadData;
</script>
</body>
</html>
