<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القياس | البيانات الحية</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f8f9fc; margin: 0; padding: 20px; color: #5a5c69; }
        .dashboard-container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #e3e6f0; padding-bottom: 15px; }
        .header h1 { color: #4e73df; margin: 0; font-size: 24px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); border: 1px solid #e3e6f0; border-right: 4px solid #4e73df; margin-bottom: 20px; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px; border-bottom: 1px solid #e3e6f0; }
        th { background-color: #f8f9fc; color: #858796; }
        #loading { text-align: center; font-size: 18px; color: #858796; padding: 50px; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>اللوحة التحليلية - إياد سليمان</h1>
        <div id="status">جاري جلب البيانات...</div>
    </div>

    <div id="loading">الرجاء التأكد من وضع الرابط الصحيح في الكود...</div>

    <div id="dashboardContent" style="display: none;">
        <div class="card">
            <h2>نظرة عامة على البيانات</h2>
            <canvas id="myChart" height="100"></canvas>
        </div>
        <div class="card">
            <h2>تفاصيل الجدول</h2>
            <div class="table-responsive">
                <table id="dataTable">
                    <thead><tr id="tableHeaders"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ استبدل الرابط أدناه برابط الـ Worker الخاص بك من Cloudflare ⚠️
    const WORKER_URL = "https://tight-wood-16cd.eyad-sulayman.workers.dev"; 

    async function loadLiveDashboard() {
        try {
            const response = await fetch(WORKER_URL);
            
            // فحص إذا كان الرد ليس JSON (مثل صفحة 404)
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new TypeError("الرابط المستخدم غير صحيح أو لا يرسل بيانات JSON!");
            }

            const data = await response.json();
            document.getElementById('loading').style.display = 'none';

            if (!data || data.length === 0) {
                document.getElementById('loading').innerText = "لا توجد بيانات حالياً. ارفع ملف Excel أولاً عبر صفحة admin.html";
                document.getElementById('loading').style.display = 'block';
                return;
            }

            document.getElementById('dashboardContent').style.display = 'block';
            document.getElementById('status').innerText = "تم تحديث البيانات بنجاح";

            // بناء الجدول
            const headers = Object.keys(data[0]);
            const headerRow = document.getElementById('tableHeaders');
            headers.forEach(h => headerRow.innerHTML += `<th>${h}</th>`);
            
            const tableBody = document.getElementById('tableBody');
            data.forEach(row => {
                let tr = "<tr>";
                headers.forEach(h => tr += `<td>${row[h] || '-'}</td>`);
                tableBody.innerHTML += tr + "</tr>";
            });

            // الرسم البياني
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(r => r[headers[0]]),
                    datasets: [{ label: headers[1], data: data.map(r => r[headers[1]]), backgroundColor: '#4e73df' }]
                }
            });

        } catch (error) {
            document.getElementById('loading').innerText = "خطأ: " + error.message;
        }
    }
    window.onload = loadLiveDashboard;
</script>
</body>
</html>
