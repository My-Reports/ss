<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القياس | البيانات الحية</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f8f9fc; margin: 0; padding: 20px; color: #5a5c69; }
        .dashboard-container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #e3e6f0; padding-bottom: 15px; }
        .header h1 { color: #4e73df; margin: 0; font-size: 24px; }
        .live-indicator { display: inline-flex; align-items: center; background: #e8f4f8; color: #36b9cc; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .live-dot { height: 10px; width: 10px; background-color: #1cc88a; border-radius: 50%; display: inline-block; margin-left: 8px; animation: blink 1.5s infinite; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
        @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }
        
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); border: 1px solid #e3e6f0; border-right: 4px solid #4e73df; }
        .card h2 { margin-top: 0; font-size: 16px; color: #4e73df; font-weight: bold; margin-bottom: 15px; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px; border-bottom: 1px solid #e3e6f0; }
        th { background-color: #f8f9fc; color: #858796; font-weight: bold; white-space: nowrap; }
        tr:hover { background-color: #f1f3f8; }
        
        #loading { text-align: center; font-size: 18px; color: #858796; padding: 50px; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>اللوحة التحليلية</h1>
        <div class="live-indicator"><span class="live-dot"></span> متصل - بيانات حية</div>
    </div>

    <div id="loading">جاري جلب البيانات من الخادم...</div>

    <div id="dashboardContent" style="display: none;">
        <div class="grid">
            <div class="card">
                <h2>نظرة عامة (رسم بياني)</h2>
                <canvas id="myChart" height="200"></canvas>
            </div>
            <div class="card">
                <h2>إحصائيات سريعة</h2>
                <div style="font-size: 36px; font-weight: bold; color: #5a5c69; margin-top: 20px;">
                    <span id="rowCount">0</span>
                    <div style="font-size: 14px; color: #858796; font-weight: normal;">إجمالي السجلات المدخلة</div>
                </div>
            </div>
        </div>

        <div class="card" style="border-right-color: #1cc88a;">
            <h2>تفاصيل البيانات</h2>
            <div class="table-responsive">
                <table id="dataTable">
                    <thead>
                        <tr id="tableHeaders"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 👇 قم بوضع رابط Cloudflare الخاص بك بين علامتي التنصيص أدناه 👇
    const WORKER_URL = "ضع_الرابط_الخاص_بك_هنا";

    async function loadLiveDashboard() {
        try {
            const response = await fetch(WORKER_URL);
            const data = await response.json();

            document.getElementById('loading').style.display = 'none';

            if (!data || data.length === 0) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = "لا توجد بيانات حالياً. يرجى رفع ملف إكسل من لوحة التحكم.";
                return;
            }

            document.getElementById('dashboardContent').style.display = 'block';
            document.getElementById('rowCount').innerText = data.length;

            // 1. بناء الجدول ديناميكياً
            const headers = Object.keys(data[0]);
            const headerRow = document.getElementById('tableHeaders');
            headers.forEach(header => {
                const th = document.createElement('th');
                th.innerText = header;
                headerRow.appendChild(th);
            });

            const tableBody = document.getElementById('tableBody');
            data.forEach(row => {
                const tr = document.createElement('tr');
                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.innerText = row[header] !== undefined ? row[header] : '-';
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });

            // 2. بناء الرسم البياني (يأخذ أول عمود كـ Label وثاني عمود كـ Value)
            if (headers.length >= 2) {
                const labels = data.map(row => row[headers[0]]);
                const values = data.map(row => {
                    let val = row[headers[1]];
                    return isNaN(val) ? 0 : Number(val);
                });

                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: headers[1],
                            data: values,
                            backgroundColor: '#4e73df',
                            borderRadius: 4
                        }]
                    },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'top' } }
                    }
                });
            }

        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
            document.getElementById('loading').innerText = "حدث خطأ في الاتصال بالخادم. يرجى التحقق من الرابط.";
        }
    }

    window.onload = loadLiveDashboard;
</script>

</body>
</html>
