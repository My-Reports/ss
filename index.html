<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  width: 90%;
  margin: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #1e293b;
}

td, th {
  padding: 10px;
  border: 1px solid #334155;
}

h1 {
  text-align: center;
}
</style>
</head>

<body>

<h1>📊 لوحة البيانات</h1>

<div class="container">
  <table id="table"></table>
  <canvas id="chart"></canvas>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 ضع config هنا
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBh-uJg7D6Js6TtwtnOUhdTKVersRV--po",
  authDomain: "dashboard-project-493a7.firebaseapp.com",
  projectId: "dashboard-project-493a7",
  storageBucket: "dashboard-project-493a7.firebasestorage.app",
  messagingSenderId: "63299059149",
  appId: "1:63299059149:web:92c5fd6a73aba40d28d884",
  measurementId: "G-8SS8ZWBZ9N"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 📥 قراءة البيانات Live
onSnapshot(collection(db, "data"), (snapshot) => {

  let table = document.getElementById("table");
  table.innerHTML = "";

  let data = [];

  snapshot.forEach(doc => {
    data.push(doc.data());
  });

  if(data.length === 0) return;

  // إنشاء الجدول
  let headers = Object.keys(data[0]);

  let headerRow = "<tr>";
  headers.forEach(h => headerRow += `<th>${h}</th>`);
  headerRow += "</tr>";

  table.innerHTML += headerRow;

  data.forEach(row => {
    let tr = "<tr>";
    headers.forEach(h => {
      tr += `<td>${row[h]}</td>`;
    });
    tr += "</tr>";
    table.innerHTML += tr;
  });

  // رسم Chart
  let labels = data.map(d => d[headers[0]]);
  let values = data.map(d => Number(d[headers[1]]));

  new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "البيانات",
        data: values
      }]
    }
  });

});

</script>

</body>
</html>
